<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Metadata -->
    <title>LibraryEase – Your Gateway to Knowledge</title>
    <meta name="title" content="LibraryEase – Your Gateway to Knowledge" />
    <meta name="description" content="LibraryEase – Your Gateway to Knowledge. Modern public library management system and digital services offering seamless book discovery, catalog search, AI reading recommendations, and branch navigation." />
    <meta name="keywords" content="LibraryEase, Library Management System, Public Library Website, Digital Library Services, Vintage Library, Book Catalog Search, Library Branch Locator, Borrow Books Online, AI Reading Assistant, Mumbai Public Library" />
    <meta name="author" content="LibraryEase" />
    <meta name="theme-color" content="#1b4332" />
    <link rel="canonical" href="https://libraryease-frontend.vercel.app/" />

    <!-- Search Engine Indexing Directives (Allow Full Crawling & Indexing) -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="bingbot" content="index, follow, max-snippet:-1, max-image-preview:large" />

    <!-- Open Graph / Facebook / LinkedIn Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://libraryease-frontend.vercel.app/" />
    <meta property="og:title" content="LibraryEase – Your Gateway to Knowledge" />
    <meta property="og:description" content="Discover thousands of books, explore public library branches, check borrowing availability, and receive AI-powered reading recommendations with LibraryEase." />

    <meta property="og:image:alt" content="LibraryEase – Your Gateway to Knowledge" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="LibraryEase" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:url" content="https://libraryease-frontend.vercel.app/" />
    <meta name="twitter:title" content="LibraryEase – Your Gateway to Knowledge" />
    <meta name="twitter:description" content="Discover books, explore public library branches, and access intelligent public library management services with LibraryEase." />
    <meta name="twitter:image" content="https://libraryease-frontend.vercel.app/og-image.png" />

    <!-- Schema.org JSON-LD Structured Data for Google Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://libraryease-frontend.vercel.app/#website",

            "@type": "SearchAction",
